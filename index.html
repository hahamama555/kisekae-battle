<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>着せ替えバトル</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Noto Sans JP",
    sans-serif;
  background:#f3f3f7;
  color:#222;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  height:100dvh;
  max-width:520px;
  margin:auto;
  background:#fff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =====================================
   HEADER
===================================== */

.header{
  flex:0 0 auto;
  padding:6px 8px 3px;
  text-align:center;
  background:#fff;
}

.mainTitle{
  font-size:22px;
  font-weight:1000;
  line-height:1.1;
}

.battleTitle{
  margin-top:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.teamTitle{
  max-width:145px;
  padding:4px 10px;
  border-radius:20px;
  color:#fff;
  font-size:12px;
  font-weight:1000;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.vsText{
  font-size:13px;
  font-weight:1000;
}

/* =====================================
   SCORE
===================================== */

.scoreArea{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:3px 7px;
}

.scoreCard{
  color:#fff;
  border-radius:11px;
  padding:4px 7px;
}

.scoreName{
  font-size:10px;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.scoreNumber{
  font-size:20px;
  font-weight:1000;
  line-height:1.05;
}

.scoreBar{
  height:6px;
  margin-top:3px;
  border-radius:10px;
  background:rgba(255,255,255,.35);
  overflow:hidden;
}

.scoreFill{
  width:0%;
  height:100%;
  background:#fff;
  border-radius:10px;
  transition:width .35s ease;
}

.scoreStatus{
  margin-top:2px;
  font-size:8px;
  font-weight:800;
}

/* =====================================
   CHARACTER
===================================== */

.characterArea{
  flex:1 1 auto;
  min-height:0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.characterName{
  position:absolute;
  top:3px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  background:rgba(255,255,255,.95);
  border-radius:20px;
  padding:4px 12px;
  font-size:11px;
  font-weight:1000;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.stage{
  position:relative;
  width:min(63vw,290px);
  height:min(63vw,290px);
  aspect-ratio:1/1;
}

.layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.baseLayer{
  z-index:1;
}

.topLayer{
  z-index:2;
}

.onepieceLayer{
  z-index:3;
}

.dressLayer{
  z-index:4;
}

.bottomLayer{
  z-index:5;
}

.outerLayer{
  z-index:6;
}

.hairLayer{
  z-index:7;
}

.accessoryLayer{
  z-index:8;
}

.shoesLayer{
  z-index:9;
}

/* =====================================
   MESSAGE
===================================== */

.message{
  flex:0 0 auto;
  min-height:22px;
  padding:2px 5px;
  text-align:center;
  font-size:11px;
  font-weight:1000;
}

/* =====================================
   PARTS
===================================== */

.partsArea{
  flex:0 0 auto;
  padding:3px 7px 4px;
}

.partsTitle{
  text-align:center;
  font-size:9px;
  font-weight:900;
  color:#777;
  margin-bottom:3px;
}

.partsGrid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:3px;
}

.part{
  aspect-ratio:1/1;
  border:2px solid #ddd;
  background:#f5f5f6;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.partIcon{
  font-size:15px;
  line-height:1;
}

.partName{
  font-size:6px;
  font-weight:900;
  margin-top:2px;
  text-align:center;
}

/* =====================================
   BOTTOM
===================================== */

.bottomMenu{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1.35fr 1fr 1fr 1fr;
  gap:4px;
  padding:5px 7px 7px;
  background:#fff;
  border-top:1px solid #eee;
}

.menuBtn{
  min-height:40px;
  border:0;
  border-radius:10px;
  background:#eee;
  font-size:10px;
  font-weight:1000;
}

.giftBtn{
  background:#ffd338;
  box-shadow:0 3px 0 #d1a800;
}

.giftBtn:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #d1a800;
}

/* =====================================
   MODAL
===================================== */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.6);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(94vw,430px);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:15px;
}

.modalTitle{
  text-align:center;
  font-size:18px;
  font-weight:1000;
  margin-bottom:8px;
}

.modalSub{
  text-align:center;
  color:#777;
  font-size:11px;
  font-weight:700;
  margin-bottom:10px;
}

.modalButtons{
  display:grid;
  gap:6px;
}

.modalBtn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:11px;
  font-size:13px;
  font-weight:1000;
}

.closeBtn{
  background:#eee;
}

.teamChoice{
  color:#fff;
}

/* =====================================
   CHARACTER GRID
===================================== */

.characterGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.characterCard{
  border:3px solid #ddd;
  border-radius:14px;
  padding:6px;
  background:#fafafa;
  text-align:center;
}

.characterCard.current{
  border-color:#222;
}

.characterCard img{
  width:100%;
  height:120px;
  object-fit:contain;
}

.characterCardName{
  margin:3px 0;
  font-size:11px;
  font-weight:1000;
}

.smallBtn{
  width:100%;
  border:0;
  border-radius:8px;
  padding:6px;
  background:#222;
  color:#fff;
  font-size:9px;
  font-weight:900;
}

.deleteBtn{
  margin-top:3px;
  background:#eee;
  color:#555;
}

/* =====================================
   FORM
===================================== */

.formGroup{
  margin-bottom:9px;
}

.formLabel{
  display:block;
  margin-bottom:4px;
  font-size:11px;
  font-weight:1000;
}

.input{
  width:100%;
  padding:9px;
  border:2px solid #ddd;
  border-radius:9px;
  background:#fff;
  font-size:14px;
}

.colorInput{
  width:100%;
  height:42px;
  padding:3px;
  border:2px solid #ddd;
  border-radius:9px;
  background:#fff;
}

/* =====================================
   ITEM GRID
===================================== */

.itemGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.itemCard{
  border:2px solid #ddd;
  border-radius:12px;
  padding:6px;
  background:#fafafa;
}

.itemCard img{
  width:100%;
  height:120px;
  object-fit:contain;
}

.itemName{
  text-align:center;
  font-size:11px;
  font-weight:1000;
}

.itemInfo{
  text-align:center;
  font-size:8px;
  color:#777;
  margin-top:2px;
}

.itemDelete{
  width:100%;
  margin-top:4px;
  padding:6px;
  border:0;
  border-radius:8px;
  background:#eee;
  font-size:9px;
  font-weight:900;
}

/* =====================================
   ROULETTE
===================================== */

.rouletteBox{
  text-align:center;
}

.rouletteIcon{
  margin:5px 0;
  font-size:50px;
}

.rouletteName{
  min-height:32px;
  font-size:21px;
  font-weight:1000;
}

.resultBox{
  margin-top:8px;
  padding:10px;
  border-radius:13px;
  background:#f4f4f7;
}

.resultBox img{
  width:155px;
  height:155px;
  object-fit:contain;
}

.resultName{
  font-size:16px;
  font-weight:1000;
}

.resultTeam{
  margin-top:3px;
  font-size:11px;
  font-weight:900;
}

/* =====================================
   WIN
===================================== */

.winEmoji{
  text-align:center;
  font-size:55px;
}

.winTitle{
  text-align:center;
  margin:6px 0;
  font-size:28px;
  font-weight:1000;
}

.winText{
  text-align:center;
  margin-bottom:12px;
  font-size:13px;
  font-weight:900;
}

.hidden{
  display:none!important;
}

/* =====================================
   SMALL SCREEN
===================================== */

@media(max-height:650px){

  .mainTitle{
    font-size:18px;
  }

  .battleTitle{
    margin-top:1px;
  }

  .teamTitle{
    font-size:10px;
    padding:3px 8px;
  }

  .stage{
    width:54vw;
    height:54vw;
  }

  .menuBtn{
    min-height:34px;
    font-size:9px;
  }

  .partIcon{
    font-size:12px;
  }

  .partName{
    font-size:5px;
  }
}
</style>
</head>


<body>

<div class="app">

<!-- =====================================
     HEADER
===================================== -->

<header class="header">

  <div class="mainTitle">
    👗 着せ替えバトル
  </div>

  <div class="battleTitle">

    <div
      id="headerTeam1"
      class="teamTitle">
      チーム1
    </div>

    <div
      id="headerVS"
      class="vsText">
      VS
    </div>

    <div
      id="headerTeam2"
      class="teamTitle">
      チーム2
    </div>

  </div>

</header>


<!-- =====================================
     SCORE
===================================== -->

<section class="scoreArea">

  <div
    id="scoreCard1"
    class="scoreCard">

    <div
      id="scoreName1"
      class="scoreName">
      チーム1
    </div>

    <div class="scoreNumber">
      <span id="score1">0</span>/8
    </div>

    <div class="scoreBar">
      <div
        id="fill1"
        class="scoreFill">
      </div>
    </div>

    <div
      id="status1"
      class="scoreStatus">
      あと8部位！
    </div>

  </div>


  <div
    id="scoreCard2"
    class="scoreCard">

    <div
      id="scoreName2"
      class="scoreName">
      チーム2
    </div>

    <div class="scoreNumber">
      <span id="score2">0</span>/8
    </div>

    <div class="scoreBar">
      <div
        id="fill2"
        class="scoreFill">
      </div>
    </div>

    <div
      id="status2"
      class="scoreStatus">
      あと8部位！
    </div>

  </div>

</section>


<!-- =====================================
     CHARACTER
===================================== -->

<main class="characterArea">

  <div
    id="characterName"
    class="characterName">
    👤 キャラクター未設定
  </div>

  <div class="stage">

    <img
      id="baseLayer"
      class="layer baseLayer"
      src=""
      alt="キャラクター">

    <img
      id="topLayer"
      class="layer topLayer"
      src=""
      alt="トップ">

    <img
      id="onepieceLayer"
      class="layer onepieceLayer"
      src=""
      alt="ワンピース">

    <img
      id="dressLayer"
      class="layer dressLayer"
      src=""
      alt="ドレス">

    <img
      id="bottomLayer"
      class="layer bottomLayer"
      src=""
      alt="ボトム">

    <img
      id="outerLayer"
      class="layer outerLayer"
      src=""
      alt="アウター">

    <img
      id="hairLayer"
      class="layer hairLayer"
      src=""
      alt="ヘア">

    <img
      id="accessoryLayer"
      class="layer accessoryLayer"
      src=""
      alt="アクセサリー">

    <img
      id="shoesLayer"
      class="layer shoesLayer"
      src=""
      alt="シューズ">

  </div>

</main>


<!-- MESSAGE -->

<div
  id="message"
  class="message">
  🎁 ギフトが来たらチームを選択！
</div>


<!-- =====================================
     PARTS
===================================== -->

<section class="partsArea">

  <div class="partsTitle">
    🏆 現在の獲得状況
  </div>

  <div
    id="partsGrid"
    class="partsGrid">
  </div>

</section>


<!-- =====================================
     BOTTOM
===================================== -->

<nav class="bottomMenu">

  <button
    type="button"
    id="giftBtn"
    class="menuBtn giftBtn">
    🎁 ギフトが来た！
  </button>

  <button
    type="button"
    id="characterBtn"
    class="menuBtn">
    👤 キャラ
  </button>

  <button
    type="button"
    id="itemBtn"
    class="menuBtn">
    👗 衣装
  </button>

  <button
    type="button"
    id="settingBtn"
    class="menuBtn">
    ⚙️ 設定
  </button>

</nav>

</div>


<!-- =====================================
     TEAM SELECT
===================================== -->

<div
  id="teamModal"
  class="modal">

  <div class="modalBox">

    <div class="modalTitle">
      🎁 ギフトが来た！
    </div>

    <div class="modalSub">
      ギフトを送ってくれた人のチームを選択
    </div>

    <div class="modalButtons">

      <button
        type="button"
        id="team1Choice"
        class="modalBtn teamChoice">
        チーム1
      </button>

      <button
        type="button"
        id="team2Choice"
        class="modalBtn teamChoice">
        チーム2
      </button>

      <button
        type="button"
        id="teamClose"
        class="modalBtn closeBtn">
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- =====================================
     ROULETTE
===================================== -->

<div
  id="rouletteModal"
  class="modal">

  <div class="modalBox rouletteBox">

    <div class="modalTitle">
      🎲 衣装抽選中！
    </div>

    <div class="rouletteIcon">
      🎁
    </div>

    <div
      id="rouletteName"
      class="rouletteName">
      抽選中…
    </div>

    <div
      id="resultBox"
      class="resultBox hidden">

      <img
        id="resultImage"
        src=""
        alt="当選衣装">

      <div
        id="resultName"
        class="resultName">
      </div>

      <div
        id="resultTeam"
        class="resultTeam">
      </div>

    </div>

  </div>

</div>


<!-- =====================================
     CHARACTER SELECT
===================================== -->

<div
  id="characterModal"
  class="modal">

  <div class="modalBox">

    <div class="modalTitle">
      👤 キャラクター選択
    </div>

    <div class="modalSub">
      バトルで使用するキャラクター
    </div>

    <div
      id="characterGrid"
      class="characterGrid">
    </div>

    <div style="height:8px"></div>

    <div class="modalButtons">

      <button
        type="button"
        id="addCharacterBtn"
        class="modalBtn"
        style="background:#222;color:#fff;">
        ➕ キャラクター追加
      </button>

      <button
        type="button"
        id="characterClose"
        class="modalBtn closeBtn">
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- =====================================
     ADD CHARACTER
===================================== -->

<div
  id="addCharacterModal"
  class="modal">

  <div class="modalBox">

    <div class="modalTitle">
      ➕ キャラクター追加
    </div>

    <div class="formGroup">

      <label class="formLabel">
        キャラクター名
      </label>

      <input
        id="characterNameInput"
        class="input"
        type="text"
        placeholder="例：プリンセスA">

    </div>

    <div class="formGroup">

      <label class="formLabel">
        キャラクター画像
      </label>

      <input
        id="characterFile"
        type="file"
        accept="image/*">

    </div>

    <div class="modalButtons">

      <button
        type="button"
        id="saveCharacterBtn"
        class="modalBtn"
        style="background:#222;color:#fff;">
        キャラクターを追加
      </button>

      <button
        type="button"
        id="addCharacterClose"
        class="modalBtn closeBtn">
        戻る
      </button>

    </div>

  </div>

</div>


<!-- =====================================
     ITEM LIST
===================================== -->

<div
  id="itemModal"
  class="modal">

  <div class="modalBox">

    <div class="modalTitle">
      👗 衣装設定
    </div>

    <div class="modalSub">
      登録した衣装
    </div>

    <div
      id="itemGrid"
      class="itemGrid">
    </div>

    <div style="height:10px"></div>

    <div class="modalButtons">

      <button
        type="button"
        id="addItemBtn"
        class="modalBtn"
        style="background:#222;color:#fff;">
        ➕ 衣装を追加
      </button>

      <button
        type="button"
        id="itemClose"
        class="modalBtn closeBtn">
        閉じる
      </button>

    </div>

  </div>

</div>


<!-- =====================================
     ADD ITEM
===================================== -->

<div
  id="addItemModal"
  class="modal">

  <div class="modalBox">

    <div class="modalTitle">
      ➕ 衣装を追加
    </div>

    <div class="formGroup">

      <label class="formLabel">
        衣装名
      </label>

      <input
        id="itemNameInput"
        class="input"
        type="text"
        placeholder="例：青いプリンセスドレス">

    </div>


    <div class="formGroup">

      <label class="formLabel">
        部位
      </label>

      <select
        id="itemCategory"
        class="input">

        <option value="top">
          👚 トップ
        </option>

        <option value="onepiece">
          👗 ワンピース
        </option>

        <option value="dress">
          👑 ドレス
        </option>

        <option value="bottom">
          👖 ボトム
        </option>

        <option value="outer">
          🧥 アウター
        </option>

        <option value="hair">
          💇 ヘア
        </option>

        <option value="accessory">
          ✨ アクセサリー
        </option>

        <option value="shoes">
          👠 シューズ
        </option>

      </select>

    </div>


    <!-- ★ここが今回の追加部分 -->

    <div class="formGroup">

      <label class="formLabel">
        🎨 所属チーム
      </label>

      <select
        id="itemTeam"
        class="input">

        <option value="1">
          チーム1
        </option>

        <option value="2">
          チーム2
        </option>

      </select>

    </div>


    <div class="formGroup">

      <label class="formLabel">
        🪙 表示コイン数
      </label>

      <input
        id="itemPrice"
        class="input"
        type="number"
        min="0"
        value="500">

    </div>


    <div class="formGroup">

      <label class="formLabel">
        衣装画像
      </label>

      <input
        id="itemFile"
        type="file"
        accept="image/*">

    </div>


    <div class="modalButtons">

      <button
        type="button"
        id="saveItemBtn"
        class="modalBtn"
        style="background:#222;color:#fff;">
        衣装を追加
      </button>

      <button
        type="button"
        id="addItemClose"
        class="modalBtn closeBtn">
        戻る
      </button>

    </div>

  </div>

</div>


<!-- =====================================
     SETTINGS
===================================== -->

<div
  id="settingModal"
  class="modal">

  <div class="modalBox">

    <div class="modalTitle">
      ⚙️ バトル設定
    </div>


    <div class="formGroup">

      <label class="formLabel">
        チーム1名
      </label>

      <input
        id="teamName1Input"
        class="input"
        type="text">

    </div>


    <div class="formGroup">

      <label class="formLabel">
        VS表示
      </label>

      <input
        id="vsInput"
        class="input"
        type="text">

    </div>


    <div class="formGroup">

      <label class="formLabel">
        チーム2名
      </label>

      <input
        id="teamName2Input"
        class="input"
        type="text">

    </div>


    <div class="formGroup">

      <label class="formLabel">
        🎨 チーム1カラー
      </label>

      <input
        id="color1Input"
        class="colorInput"
        type="color">

    </div>


    <div class="formGroup">

      <label class="formLabel">
        🎨 チーム2カラー
      </label>

      <input
        id="color2Input"
        class="colorInput"
        type="color">

    </div>


    <div class="modalButtons">

      <button
        type="button"
        id="saveSettingBtn"
        class="modalBtn"
        style="background:#222;color:#fff;">
        💾 設定を保存
      </button>

      <button
        type="button"
        id="resetBattleBtn"
        class="modalBtn"

  {

  },

    icon:"👖"
  },

    icon:"🧥"
  },

  {

    name:"ヘア",
    icon:"💇"
  },

  {
    id:"accessory",
    name:"アクセ",
    icon:"✨"
  },

  {
    id:"shoes",
    name:"シューズ",
    icon:"👠"
  }

];


/* =====================================================
   設定
===================================================== */

let settings = {

  team1:"1〜6月生まれ",

  vs:"VS",

  team2:"7〜12月生まれ",

  color1:"#2586e8",

  color2:"#ef4b52"

};


/* =====================================================
   データ
===================================================== */

let characters = [];

let currentCharacterId = null;

let items = [];


/*
  各部位を現在どちらのチームが
  獲得しているか

  null / 1 / 2
*/

let owners = {};

let battleFinished = false;


/* =====================================================
   初期化
===================================================== */

function resetOwners(){

  owners = {};

  PARTS.forEach(part=>{

    owners[part.id] = null;

  });

}


/* =====================================================
   保存
===================================================== */

function saveData(){

  try{

    localStorage.setItem(
      "dressBattleSettings",
      JSON.stringify(settings)
    );

    localStorage.setItem(
      "dressBattleCharacters",
      JSON.stringify(characters)
    );

    localStorage.setItem(
      "dressBattleCurrentCharacter",
      currentCharacterId || ""
    );

    localStorage.setItem(
      "dressBattleItems",
      JSON.stringify(items)
    );

    localStorage.setItem(
      "dressBattleOwners",
      JSON.stringify(owners)
    );

    localStorage.setItem(
      "dressBattleFinished",
      battleFinished
        ? "1"
        : "0"
    );

  }catch(error){

    console.warn(
      "データ保存エラー",
      error
    );

  }

}


/* =====================================================
   読み込み
===================================================== */

function loadData(){

  try{

    const s =
      localStorage.getItem(
        "dressBattleSettings"
      );

    if(s){

      settings = {

        ...settings,

        ...JSON.parse(s)

      };

    }


    const c =
      localStorage.getItem(
        "dressBattleCharacters"
      );

    if(c){

      characters =
        JSON.parse(c);

    }


    currentCharacterId =
      localStorage.getItem(
        "dressBattleCurrentCharacter"
      ) || null;


    const i =
      localStorage.getItem(
        "dressBattleItems"
      );

    if(i){

      items =
        JSON.parse(i);

    }


    resetOwners();


    const o =
      localStorage.getItem(
        "dressBattleOwners"
      );

    if(o){

      const data =
        JSON.parse(o);

      PARTS.forEach(part=>{

        owners[part.id] =
          data[part.id] || null;

      });

    }


    battleFinished =
      localStorage.getItem(
        "dressBattleFinished"
      ) === "1";


  }catch(error){

    console.warn(
      "データ読み込みエラー",
      error
    );

    resetOwners();

  }

}

function closeModal(id){

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =====================================================
   キャラクター
===================================================== */

function getCurrentCharacter(){

  return characters.find(
    c =>
      c.id === currentCharacterId
  );

}


function createCharacter(
  name,
  image
){

  const character = {

    id:
      "char_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2),

    name:
      name ||
      "キャラクター",

    image:image,

    equipped:{

      top:null,
      onepiece:null,
      dress:null,
      bottom:null,
      outer:null,
      hair:null,
      accessory:null,
      shoes:null

    }

  };


  characters.push(
    character
  );


  currentCharacterId =
    character.id;


  saveData();

  renderCharacter();

}


/* =====================================================
   キャラクター表示
===================================================== */

function renderCharacter(){

  const character =
    getCurrentCharacter();


  const nameEl =
    document.getElementById(
      "characterName"
    );


  if(!character){

    nameEl.textContent =
      "👤 キャラクター未設定";

    PARTS.forEach(part=>{

      const el =
        document.getElementById(
          part.id + "Layer"
        );

      if(el){

        el.src = "";

      }

    });

    return;

  }


  nameEl.textContent =
    "👤 " + character.name;


  document
    .getElementById("baseLayer")
    .src =
      character.image || "";


  const equipped =
    character.equipped || {};


  PARTS.forEach(part=>{

    const el =
      document.getElementById(
        part.id + "Layer"
      );

    if(!el) return;


    const item =
      equipped[part.id];


    el.src =
      item && item.image
        ? item.image
        : "";

  });


  /*
    ワンピース・ドレスがある場合は
    トップ・ボトムを隠す
  */

  const whole =
    !!equipped.onepiece ||
    !!equipped.dress;


  document
    .getElementById("topLayer")
    .style.display =
      whole
        ? "none"
        : "";

  document
    .getElementById("bottomLayer")
    .style.display =
      whole
        ? "none"
        : "";

}

          currentCharacterId ===

          currentCharacterId =

        saveData();

        renderCharacters();

        renderCharacter();

      };


    grid.appendChild(card);

  });

/* =====================================================
   ファイル → DataURL
===================================================== */

function fileToDataURL(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        ()=>resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =====================================================
   透明画像の表示用トリミング
===================================================== */

function cropImageForDisplay(
  src,
  callback
){

  const img =
    new Image();


  img.onload = ()=>{

    try{

      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        img.naturalWidth;

      canvas.height =
        img.naturalHeight;


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.drawImage(
        img,
        0,
        0
      );


      const data =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        ).data;


      let minX =
        canvas.width;

      let minY =
        canvas.height;

      let maxX = -1;

      let maxY = -1;


      for(
        let y=0;
        y<canvas.height;
        y++
      ){

        for(
          let x=0;
          x<canvas.width;
          x++
        ){

          const alpha =
            data[
              (y * canvas.width + x) * 4 + 3
            ];


          if(alpha > 5){

            if(x < minX) minX=x;

            if(y < minY) minY=y;

            if(x > maxX) maxX=x;

            if(y > maxY) maxY=y;

          }

        }

      }


      if(maxX < 0){

        callback(src);

        return;

      }


      const width =
        maxX - minX + 1;

      const height =
        maxY - minY + 1;


      const output =
        document.createElement(
          "canvas"
        );


      output.width =
        width;

      output.height =
        height;


      output
        .getContext("2d")
        .drawImage(
          canvas,
          minX,
          minY,
          width,
          height,
          0,
          0,
          width,
          height
        );


      callback(
        output.toDataURL(
          "image/png"
        )
      );

    }catch(error){

      callback(src);

    }

  };


  img.onerror =
    ()=>{
      callback(src);
    };


  img.src = src;

}

/* =====================================================
   チームの獲得数
===================================================== */

function countTeam(team){

  return PARTS.filter(
    part =>
      owners[part.id] === team
  ).length;

}

   バトル表示
===================================================== */

function renderBattle(){

  const count2 =
    countTeam(2);

      count1;

  document

    `;

/* =====================================================
   チームの未獲得部位
===================================================== */

function getMissingParts(team){

  return PARTS.filter(
    part =>
      owners[part.id] !== team
  );

}


/* =====================================================
   チームカラー衣装だけを取得
===================================================== */

function getTeamItems(team){

  return items.filter(
    item =>
      Number(item.team) ===
      Number(team)
  );

}


/* =====================================================
   抽選する衣装を決定
===================================================== */

function selectWinningItem(team){

  const teamItems =
    getTeamItems(team);


  if(!teamItems.length){

    return null;

  }


  /*
    まだそのチームが持っていない
    部位の衣装を優先する
  */

  const missingParts =
    getMissingParts(team);


  const usefulItems =
    teamItems.filter(
      item =>
        missingParts.some(
          part =>
            part.id ===
            item.category
        )
    );


  /*
    まだ揃っていない部位があれば、
    その中から抽選
  */

  if(usefulItems.length){

    return usefulItems[
      Math.floor(
        Math.random() *
        usefulItems.length
      )
    ];

  }


  /*
    全部揃っている場合は
    チーム衣装から普通に抽選
  */

  return teamItems[
    Math.floor(
      Math.random() *
      teamItems.length
    )
  ];

}


/* =====================================================
   衣装を装着
===================================================== */

function equipItem(item){

  const character =
    getCurrentCharacter();


  if(!character){

    return;

  }


  if(!character.equipped){

    character.equipped = {};

  }


  /*
    ワンピ・ドレス
    ↓
    トップ・ボトムを解除
  */

  if(
    item.category ===
      "onepiece" ||
    item.category ===
      "dress"
  ){

    character.equipped.top =
      null;

    character.equipped.bottom =
      null;

  }


  /*
    トップ・ボトム
    ↓
    ワンピ・ドレスを解除
  */

  if(
    item.category ===
      "top" ||
    item.category ===
      "bottom"
  ){

    character.equipped.onepiece =
      null;

    character.equipped.dress =
      null;

  }


  character.equipped[
    item.category
  ] = item;


  renderCharacter();

}


/* =====================================================
   ギフト抽選開始
===================================================== */

function startDraw(team){

  closeModal(
    "teamModal"
  );


  const teamItems =
    getTeamItems(team);


  /*
    チーム衣装がまだない場合
  */

  if(!teamItems.length){

    const teamName =
      team === 1
        ? settings.team1
        : settings.team2;


    document
      .getElementById("message")
      .textContent =
        "⚠️ " +
        teamName +
        "の衣装がまだ登録されていません";


    return;

  }


  openModal(
    "rouletteModal"
  );


  const rouletteName =
    document.getElementById(
      "rouletteName"
    );


  const resultBox =
    document.getElementById(
      "resultBox"
    );


  resultBox.classList.add(
    "hidden"
  );


  /*
    最終当選アイテム
  */

  const winningItem =
    selectWinningItem(team);


  if(!winningItem){

    closeModal(
      "rouletteModal"
    );

    return;

  }


  /*
    ルーレット演出
  */

  let count = 0;


  const timer =
    setInterval(()=>{

      const random =
        teamItems[
          Math.floor(
            Math.random() *
            teamItems.length
          )
        ];


      const category =
        PARTS.find(
          p =>
            p.id ===
            random.category
        );


      rouletteName.textContent =
        (
          category
            ? category.icon
            : "👗"
        ) +
        " " +
        random.name;


      count++;


      if(count >= 18){

        clearInterval(timer);

        finishDraw(
          team,
          winningItem
        );

      }

    },85);

}


/* =====================================================
   抽選結果
===================================================== */

function finishDraw(
  team,
  item
){

  /*
    この部位をチームのものにする
  */

  owners[item.category] =
    team;


  /*
    キャラクターに装着
  */

  equipItem(item);


  const resultBox =
    document.getElementById(
      "resultBox"
    );


  const resultImage =
    document.getElementById(
      "resultImage"
    );


  const resultName =
    document.getElementById(
      "resultName"
    );


  const resultTeam =
    document.getElementById(
      "resultTeam"
    );


  resultImage.src =
    item.image || "";


  resultName.textContent =
    "🎉 " +
    item.name +
    " GET！";


  resultTeam.textContent =
    team === 1
      ? "🔵 " + settings.team1
      : "🔴 " + settings.team2;


  resultBox.classList.remove(
    "hidden"
  );


  renderBattle();

  saveData();


  document
    .getElementById("message")
    .textContent =
      (
        team === 1
          ? "🔵 "
          : "🔴 "
      ) +
      (
        team === 1
          ? settings.team1
          : settings.team2
      ) +
      "が「" +
      item.name +
      "」をGET！";


  setTimeout(
    ()=>{
      checkWinner();
    },
    1000
  );

}


/* =====================================================
   勝者判定
===================================================== */

function checkWinner(){

  const count1 =
    countTeam(1);

  const count2 =
    countTeam(2);


  if(
    count1 < 8 &&
    count2 < 8
  ){

    closeModal(
      "rouletteModal"
    );

    return;

  }


  if(count1 >= 8){

    battleFinished = true;

    showWinner(1);

    saveData();

    return;

  }


  if(count2 >= 8){

    battleFinished = true;

    showWinner(2);

    saveData();

    return;

  }

}


/* =====================================================
   勝利表示
===================================================== */

function showWinner(team){

  closeModal(
    "rouletteModal"
  );


  const teamName =
    team === 1
      ? settings.team1
      : settings.team2;


  const teamColor =
    team === 1
      ? settings.color1
      : settings.color2;


  const title =
    document.getElementById(
      "winTitle"
    );


  title.textContent =
    "🏆 " +
    teamName +
    " WIN!";


  title.style.color =
    teamColor;


  document
    .getElementById("winText")
    .textContent =
      "全身8部位を完成させました！";


  openModal(
    "winModal"
  );

}


/* =====================================================
   バトルリセット
===================================================== */

function resetBattle(){

  resetOwners();

  battleFinished =
    false;


  const character =
    getCurrentCharacter();


  if(character){

    character.equipped = {

      top:null,
      onepiece:null,
      dress:null,
      bottom:null,
      outer:null,
      hair:null,
      accessory:null,
      shoes:null

    };

  }


  saveData();

  renderBattle();

  renderCharacter();


  document
    .getElementById("message")
    .textContent =
      "🔥 新しいバトルスタート！";

}

/* =====================================

===================================== */

document
  .getElementById("saveItemBtn")
  .onclick =
    async ()=>{

      const name =
        document
          .getElementById(
            "itemNameInput"
          )
          .value
          .trim();


      const category =
        document
          .getElementById(
            "itemCategory"
          )
          .value;


      const team =
        Number(
          document
            .getElementById(
              "itemTeam"
            )
            .value
        );


      const price =
        Number(
          document
            .getElementById(
              "itemPrice"
            )
            .value ||
          0
        );


      const file =
        document
          .getElementById(
            "itemFile"
          )
          .files[0];


      if(!name){

        alert(
          "衣装名を入力してください。"
        );

        return;

      }


      if(!file){

        alert(
          "衣装画像を選択してください。"
        );

        return;

      }


      const image =
        await fileToDataURL(
          file
        );


      items.push({

        id:
          "item_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2),

        name:name,

        category:category,

        team:team,

        price:price,

        image:image

      });


      saveData();


      /*
        入力欄をクリア
      */

      document
        .getElementById(
          "itemNameInput"
        )
        .value = "";


      document
        .getElementById(
          "itemFile"
        )
        .value = "";


      closeModal(
        "addItemModal"
      );


      renderItems();


      openModal(
        "itemModal"
      );

    };
