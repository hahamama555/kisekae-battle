<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>ギフトで着せ替えバトル</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Helvetica Neue",
    Arial,
    sans-serif;
  background:#f4f4f8;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

/* =========================
   全体
========================= */

.app{
  width:100vw;
  height:100dvh;
  max-width:600px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#fff;
  position:relative;
}

/* =========================
   ヘッダー
========================= */

.header{
  flex:0 0 auto;
  padding:7px 10px 5px;
  background:#111;
  color:#fff;
  text-align:center;
  position:relative;
  z-index:100;
}

.title{
  font-size:clamp(18px,5vw,27px);
  font-weight:900;
  line-height:1.15;
  letter-spacing:.03em;
}

.vsTitle{
  margin-top:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:clamp(12px,3.5vw,17px);
  font-weight:900;
}

.teamName{
  padding:3px 9px;
  border-radius:999px;
  color:#fff;
  max-width:42%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.vsText{
  color:#fff;
  font-weight:1000;
}

/* =========================
   メイン
========================= */

.main{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

/* =========================
   キャラクターエリア
========================= */

.characterArea{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at center,#ffffff 0%,#f7f7fa 58%,#ededf2 100%);
  pointer-events:none;
}

.characterStage{
  position:relative;
  width:100%;
  height:100%;
  max-width:560px;
  pointer-events:none;
}

.characterStage img{
  position:absolute;
  left:50%;
  top:50%;
  width:100%;
  height:100%;
  transform:translate(-50%,-50%);
  object-fit:contain;
  pointer-events:none;
  user-select:none;
}

/*
  キャラクターを大きくするための
  表示倍率。
*/
.characterStage img.baseCharacter{
  transform:translate(-50%,-50%) scale(1);
}

.characterStage img.wearItem{
  transform:translate(-50%,-50%) scale(1);
}

/* =========================
   8パーツ進行状況
========================= */

.progressArea{
  flex:0 0 auto;
  padding:4px 8px 5px;
  background:#fff;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
  position:relative;
  z-index:30;
}

.progressTitle{
  text-align:center;
  font-size:11px;
  font-weight:900;
  color:#555;
  margin-bottom:3px;
}

.progressBar{
  width:100%;
  height:8px;
  border-radius:999px;
  background:#e8e8ed;
  overflow:hidden;
}

.progressFill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#ff3b30,#ff9500);
  border-radius:999px;
  transition:.25s;
}

.progressText{
  text-align:center;
  font-size:11px;
  font-weight:900;
  margin-top:2px;
}

/* =========================
   ギフトボタン
========================= */

.giftArea{
  flex:0 0 auto;
  padding:6px 9px;
  background:#fff;
  position:relative;
  z-index:40;
}

.giftBtn{
  width:100%;
  height:48px;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(135deg,#ff2d55,#ff0050);
  font-size:clamp(17px,5vw,23px);
  font-weight:1000;
  box-shadow:0 4px 10px rgba(255,0,70,.25);
  touch-action:manipulation;
}

.giftBtn:active{
  transform:scale(.97);
}

/* =========================
   下部メニュー
========================= */

.bottomMenu{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  padding:5px 7px calc(6px + env(safe-area-inset-bottom));
  background:#111;
  position:relative;
  z-index:50;
}

.menuBtn{
  min-height:40px;
  border-radius:10px;
  color:#fff;
  background:#333;
  font-size:12px;
  font-weight:900;
  touch-action:manipulation;
}

.menuBtn:active{
  transform:scale(.96);
}

/* =========================
   モーダル
========================= */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.68);
  z-index:1000;
  pointer-events:none;
}

.modal.show{
  display:flex;
  pointer-events:auto;
}

.modalBox{
  width:min(94vw,520px);
  max-height:90dvh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:16px;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  position:relative;
  z-index:1001;
  pointer-events:auto;
}

.modalTitle{
  font-size:20px;
  font-weight:1000;
  text-align:center;
  margin-bottom:12px;
}

.closeBtn{
  position:absolute;
  right:10px;
  top:8px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#eee;
  font-size:20px;
  font-weight:900;
  z-index:5;
}

.formGroup{
  margin-bottom:11px;
}

.formGroup label{
  display:block;
  font-size:12px;
  font-weight:900;
  color:#555;
  margin-bottom:4px;
}

.formGroup input,
.formGroup select{
  width:100%;
  height:42px;
  padding:0 10px;
  border:1px solid #ccc;
  border-radius:10px;
  background:#fff;
  outline:none;
}

.formGroup input:focus,
.formGroup select:focus{
  border-color:#555;
}

.primaryBtn{
  width:100%;
  min-height:44px;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-weight:1000;
  margin-top:5px;
}

.secondaryBtn{
  width:100%;
  min-height:42px;
  border-radius:12px;
  background:#eee;
  color:#111;
  font-weight:900;
  margin-top:6px;
}

.dangerBtn{
  width:100%;
  min-height:42px;
  border-radius:12px;
  background:#ff3b30;
  color:#fff;
  font-weight:900;
  margin-top:6px;
}

/* =========================
   チーム選択
========================= */

.teamChoice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.teamChoiceBtn{
  min-height:90px;
  border-radius:18px;
  color:#fff;
  font-size:17px;
  font-weight:1000;
  padding:10px;
}

.teamChoiceBtn small{
  display:block;
  margin-top:5px;
  font-size:11px;
  opacity:.9;
}

/* =========================
   ルーレット
========================= */

.roulette{
  width:160px;
  height:160px;
  margin:10px auto 15px;
  border-radius:50%;
  background:
    conic-gradient(
      #ff3b30 0 12.5%,
      #ff9500 12.5% 25%,
      #ffcc00 25% 37.5%,
      #34c759 37.5% 50%,
      #00c7be 50% 62.5%,
      #007aff 62.5% 75%,
      #5856d6 75% 87.5%,
      #af52de 87.5% 100%
    );
  border:7px solid #111;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 7px 20px rgba(0,0,0,.2);
}

.rouletteCenter{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:12px;
  font-weight:1000;
  border:3px solid #111;
}

.roulette.spinning{
  animation:spin .65s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.resultBox{
  text-align:center;
  padding:10px;
  border-radius:12px;
  background:#f4f4f7;
  margin-bottom:10px;
}

.resultBox strong{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.resultBox span{
  font-size:13px;
  font-weight:900;
}

/* =========================
   アイテム一覧
========================= */

.itemGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
  margin-top:8px;
}

.itemCard{
  position:relative;
  min-width:0;
  border:2px solid #e1e1e5;
  border-radius:14px;
  padding:7px;
  background:#fff;
}

.itemCard img{
  display:block;
  width:100%;
  height:125px;
  object-fit:contain;
  background:#fafafa;
  border-radius:9px;
}

.itemName{
  margin-top:5px;
  font-size:12px;
  font-weight:1000;
  line-height:1.25;
}

.itemPrice{
  margin-top:2px;
  font-size:10px;
  color:#777;
  font-weight:900;
}

.itemTeam{
  display:inline-block;
  margin-top:4px;
  padding:2px 7px;
  border-radius:999px;
  color:#fff;
  font-size:9px;
  font-weight:1000;
}

.itemDelete{
  width:100%;
  min-height:30px;
  margin-top:5px;
  border-radius:8px;
  background:#eee;
  font-size:10px;
  font-weight:900;
}

.emptyText{
  text-align:center;
  color:#888;
  font-size:13px;
  font-weight:900;
  padding:25px 5px;
}

/* =========================
   カテゴリー
========================= */

.categoryTabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-bottom:8px;
}

.categoryBtn{
  min-height:36px;
  border-radius:9px;
  background:#eee;
  font-size:11px;
  font-weight:1000;
  touch-action:manipulation;
}

.categoryBtn.active{
  background:#111;
  color:#fff;
}

/* =========================
   キャラクター一覧
========================= */

.characterGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.characterCard{
  border:2px solid #ddd;
  border-radius:13px;
  padding:6px;
  background:#fff;
}

.characterCard.selected{
  border-color:#111;
}

.characterCard img{
  width:100%;
  height:145px;
  object-fit:contain;
  background:#fafafa;
  border-radius:9px;
}

.characterCardName{
  font-size:11px;
  font-weight:1000;
  text-align:center;
  margin-top:4px;
}

.characterCard button{
  width:100%;
  height:30px;
  border-radius:8px;
  background:#111;
  color:#fff;
  font-size:10px;
  font-weight:900;
  margin-top:5px;
}

/* =========================
   勝利画面
========================= */

.winBox{
  text-align:center;
}

.winEmoji{
  font-size:65px;
  line-height:1;
  margin:10px 0;
}

.winTitle{
  font-size:30px;
  font-weight:1000;
}

.winTeam{
  font-size:24px;
  font-weight:1000;
  margin:5px 0 12px;
}

.winMessage{
  font-size:13px;
  font-weight:900;
}

/* =========================
   設定色プレビュー
========================= */

.colorRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.colorRow input{
  width:100%;
  height:42px;
  padding:3px;
}

/* =========================
   レスポンシブ
========================= */

@media(max-height:700px){
  .header{
    padding:4px 8px;
  }

  .giftBtn{
    height:43px;
  }

  .progressArea{
    padding:3px 7px 4px;
  }

  .bottomMenu{
    padding-top:4px;
    padding-bottom:4px;
  }

  .menuBtn{
    min-height:35px;
    font-size:11px;
  }
}

@media(min-width:500px){
  .giftBtn{
    max-width:520px;
    display:block;
    margin:0 auto;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================
       HEADER
  ====================== -->
  <header class="header">

    <div class="title">
      🎁 ギフトで着せ替えバトル
    </div>

    <div class="vsTitle">
      <span
        id="team1Header"
        class="teamName"
      >1〜6月生まれ</span>

      <span
        id="vsHeader"
        class="vsText"
      >VS</span>

      <span
        id="team2Header"
        class="teamName"
      >7〜12月生まれ</span>
    </div>

  </header>


  <!-- =====================
       MAIN
  ====================== -->

  <main class="main">

    <!-- キャラクター -->
    <section class="characterArea">

      <div
        id="characterStage"
        class="characterStage"
      ></div>

    </section>


    <!-- 進行状況 -->
    <section class="progressArea">

      <div class="progressTitle">
        👗 着せ替えパーツ獲得状況
      </div>

      <div class="progressBar">
        <div
          id="progressFill"
          class="progressFill"
        ></div>
      </div>

      <div
        id="progressText"
        class="progressText"
      >
        0 / 8
      </div>

    </section>


    <!-- ギフト -->
    <section class="giftArea">

      <button
        type="button"
        id="giftBtn"
        class="giftBtn"
      >
        🎁 ギフトが来た！
      </button>

    </section>

  </main>


  <!-- =====================
       BOTTOM MENU
  ====================== -->

  <nav class="bottomMenu">

    <button
      type="button"
      class="menuBtn"
      id="settingsBtn"
    >
      ⚙️ 設定
    </button>

    <button
      type="button"
      class="menuBtn"
      id="characterBtn"
    >
      👤 キャラ
    </button>

    <button
      type="button"
      class="menuBtn"
      id="itemBtn"
    >
      👗 アイテム
    </button>

    <button
      type="button"
      class="menuBtn"
      id="resetBtn"
    >
      🔄 リセット
    </button>

  </nav>

</div>


<!-- =====================================================
     TEAM SELECT MODAL
===================================================== -->

<div
  id="teamModal"
  class="modal"
>

  <div class="modalBox">

    <button
      type="button"
      class="closeBtn"
      data-close="teamModal"
    >
      ×
    </button>

    <div class="modalTitle">
      🎁 どちらのチーム？
    </div>

    <div class="teamChoice">

      <button
        type="button"
        id="team1Choice"
        class="teamChoiceBtn"
      >
        <span id="team1ChoiceName">
          1〜6月生まれ
        </span>
        <small>
          ギフトを獲得！
        </small>
      </button>

      <button
        type="button"
        id="team2Choice"
        class="teamChoiceBtn"
      >
        <span id="team2ChoiceName">
          7〜12月生まれ
        </span>
        <small>
          ギフトを獲得！
        </small>
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     ROULETTE MODAL
===================================================== -->

<div
  id="rouletteModal"
  class="modal"
>

  <div class="modalBox">

    <div class="modalTitle">
      🎲 着せ替えパーツ抽選
    </div>

    <div class="resultBox">

      <strong id="drawTeamName">
        チーム
      </strong>

      <span id="drawStatus">
        抽選中…
      </span>

    </div>

    <div
      id="roulette"
      class="roulette"
    >
      <div class="rouletteCenter">
        DRAW
      </div>
    </div>

    <div
      id="rouletteResult"
      class="resultBox"
      style="display:none"
    >
      <strong id="rouletteCategory">
        トップ
      </strong>

      <span id="rouletteItemName">
        アイテム
      </span>
    </div>

    <button
      type="button"
      id="closeRouletteBtn"
      class="primaryBtn"
      style="display:none"
    >
      OK
    </button>

  </div>

</div>


<!-- =====================================================
     WIN MODAL
===================================================== -->

<div
  id="winModal"
  class="modal"
>

  <div class="modalBox winBox">

    <div class="winEmoji">
      🏆
    </div>

    <div class="winTitle">
      COMPLETE!
    </div>

    <div
      id="winTeamName"
      class="winTeam"
    >
      チーム
    </div>

    <div class="winMessage">
      8パーツをすべて獲得しました！
    </div>

    <button
      type="button"
      id="winCloseBtn"
      class="primaryBtn"
    >
      閉じる
    </button>

  </div>

</div>


<!-- =====================================================
     SETTINGS MODAL
===================================================== -->

<div
  id="settingsModal"
  class="modal"
>

  <div class="modalBox">

    <button
      type="button"
      class="closeBtn"
      data-close="settingsModal"
    >
      ×
    </button>

    <div class="modalTitle">
      ⚙️ バトル設定
    </div>


    <div class="formGroup">

      <label>
        チーム1
      </label>

      <input
        id="team1Input"
        type="text"
        maxlength="30"
        value="1〜6月生まれ"
      >

    </div>


    <div class="formGroup">

      <label>
        VS表示
      </label>

      <input
        id="vsInput"
        type="text"
        maxlength="10"
        value="VS"
      >

    </div>


    <div class="formGroup">

      <label>
        チーム2
      </label>

      <input
        id="team2Input"
        type="text"
        maxlength="30"
        value="7〜12月生まれ"
      >

    </div>


    <div class="formGroup">

      <label>
        チームカラー
      </label>

      <div class="colorRow">

        <div>
          <input
            id="team1Color"
            type="color"
            value="#ff3b30"
          >
        </div>

        <div>
          <input
            id="team2Color"
            type="color"
            value="#007aff"
          >
        </div>

      </div>

    </div>


    <button
      type="button"
      id="saveSettingsBtn"
      class="primaryBtn"
    >
      設定を保存
    </button>

  </div>

</div>


<!-- =====================================================
     CHARACTER MODAL
===================================================== -->

<div
  id="characterModal"
  class="modal"
>

  <div class="modalBox">

    <button
      type="button"
      class="closeBtn"
      data-close="characterModal"
    >
      ×
    </button>

    <div class="modalTitle">
      👤 キャラクター設定
    </div>


    <div class="formGroup">

      <label>
        キャラクター名
      </label>

      <input
        id="characterName"
        type="text"
        maxlength="30"
        placeholder="例：キャラクター1"
      >

    </div>


    <div class="formGroup">

      <label>
        キャラクター画像
      </label>

      <input
        id="characterFile"
        type="file"
        accept="image/*"
      >

    </div>


    <button
      type="button"
      id="addCharacterBtn"
      class="primaryBtn"
    >
      キャラクターを追加
    </button>


    <div
      id="characterList"
      class="characterGrid"
      style="margin-top:12px"
    ></div>

  </div>

</div>


<!-- =====================================================
     ITEM MODAL
===================================================== -->

<div
  id="itemModal"
  class="modal"
>

  <div class="modalBox">

    <button
      type="button"
      class="closeBtn"
      data-close="itemModal"
    >
      ×
    </button>

    <div class="modalTitle">
      👗 アイテム設定
    </div>


    <div class="formGroup">

      <label>
        アイテム名
      </label>

      <input
        id="itemName"
        type="text"
        maxlength="30"
        placeholder="例：プリンセスドレス"
      >

    </div>


    <div class="formGroup">

      <label>
        カテゴリー
      </label>

      <select id="itemCategory">

        <option value="top">
          トップ
        </option>

        <option value="onepiece">
          ワンピース
        </option>

        <option value="dress">
          ドレス
        </option>

        <option value="bottom">
          ボトムス
        </option>

        <option value="outer">
          アウター
        </option>

        <option value="hair">
          ヘア
        </option>

        <option value="accessory">
          アクセサリー
        </option>

        <option value="shoes">
          靴
        </option>

      </select>

    </div>


    <div class="formGroup">

      <label>
        表示価格
        <small>※コインは消費しません</small>
      </label>

      <input
        id="itemPrice"
        type="number"
        min="0"
        value="500"
        placeholder="500"
      >

    </div>


    <div class="formGroup">

      <label>
        所属チーム
      </label>

      <select id="itemTeam">

        <option value="team1">
          チーム1
        </option>

        <option value="team2">
          チーム2
        </option>

      </select>

    </div>


    <div class="formGroup">

      <label>
        アイテム画像
      </label>

      <input
        id="itemFile"
        type="file"
        accept="image/*"
      >

    </div>


    <button
      type="button"
      id="addItemBtn"
      class="primaryBtn"
    >
      アイテムを追加
    </button>


    <div

    bottom:null,

    accessory:null,

   保存

function saveData(){

    localStorage.setItem(
      "giftDressBattleData",

/* =====================================================

===================================================== */

function loadData(){

  try{

    const parsed =
      JSON.parse(saved);

    data = {

      owners:{
        ...data.owners,
        ...(parsed.owners || {})
      },

      equipped:{
        ...data.equipped,
        ...(parsed.equipped || {})

/* =====================================================
   画像を表示用にトリミング
===================================================== */

function cropImageForDisplay(src){

  return new Promise(resolve => {

    const img = new Image();

    img.onload = function(){

      try{

        const canvas =
          document.createElement("canvas");

        const ctx =
          canvas.getContext("2d");

        canvas.width =
          img.naturalWidth;

        canvas.height =
          img.naturalHeight;

        ctx.drawImage(
          img,
          0,
          0
        );

        const imageData =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );

        const pixels =
          imageData.data;

        let minX = canvas.width;
        let minY = canvas.height;
        let maxX = -1;
        let maxY = -1;

        for(
          let y = 0;
          y < canvas.height;
          y++
        ){

          for(
            let x = 0;
            x < canvas.width;
            x++
          ){

            const alpha =
              pixels[
                (y * canvas.width + x) * 4 + 3
              ];

            if(alpha > 5){

              if(x < minX) minX = x;
              if(y < minY) minY = y;
              if(x > maxX) maxX = x;
              if(y > maxY) maxY = y;

            }

          }

        }

        if(maxX < 0){

          resolve(src);
          return;

        }

        const padding = 2;

        minX =
          Math.max(
            0,
            minX - padding
          );

        minY =
          Math.max(
            0,
            minY - padding
          );

        maxX =
          Math.min(
            canvas.width - 1,
            maxX + padding
          );

        maxY =
          Math.min(
            canvas.height - 1,
            maxY + padding
          );

        const w =
          maxX - minX + 1;

        const h =
          maxY - minY + 1;

        const out =
          document.createElement("canvas");

        out.width = w;
        out.height = h;

        out
          .getContext("2d")
          .drawImage(
            canvas,
            minX,
            minY,
            w,
            h,
            0,
            0,
            w,
            h
          );

        resolve(
          out.toDataURL("image/png")
        );

      }catch(e){

        resolve(src);

      }

    };

    img.onerror = () => resolve(src);

    img.src = src;

  });

}


/* =====================================================
   キャラクター表示
===================================================== */

function renderCharacter(){

  const stage =
    $("characterStage");

  stage.innerHTML = "";

  if(
    data.selectedCharacter === null ||
    !data.characters[data.selectedCharacter]
  ){

    const text =
      document.createElement("div");

    text.style.cssText = `
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      text-align:center;
      font-size:15px;
      font-weight:900;
      color:#999;
      width:90%;
    `;

    text.innerHTML =
      "👤 キャラクターを登録してください";

    stage.appendChild(text);

    return;

  }


  const character =
    data.characters[
      data.selectedCharacter
    ];


  /* ベース */

  const base =
    document.createElement("img");

  base.src =
    character.src;

  base.className =
    "baseCharacter";

  stage.appendChild(base);


  /*
    表示順：
    ベース
    トップ
    ワンピース
    ドレス
    ボトム
    アウター
    ヘア
    アクセサリー
    靴
  */

  CATEGORIES.forEach(category => {

    const itemId =
      data.equipped[category];

    if(!itemId) return;

    const item =
      data.items.find(
        x => x.id === itemId
      );

    if(!item) return;

    const img =
      document.createElement("img");

    img.src =
      item.src;

    img.className =
      "wearItem";

    img.dataset.category =
      category;

    stage.appendChild(img);

  });

}


/* =====================================================
   進行状況
===================================================== */

function updateProgress(){

  let count = 0;

  CATEGORIES.forEach(category => {

    if(
      data.owners[category] === "team1" ||
      data.owners[category] === "team2"
    ){

      count++;

    }

  });


  $("progressText").textContent =
    `${count} / ${CATEGORIES.length}`;

  $("progressFill").style.width =
    `${count / CATEGORIES.length * 100}%`;

}


/* =====================================================
   足りないカテゴリー
===================================================== */

function getMissingParts(team){

  return CATEGORIES.filter(
    category =>
      data.owners[category] !== team
  );

}


/* =====================================================
   チームアイテム取得
===================================================== */

function getTeamItems(team){

  return data.items.filter(
    item =>
      item.team === team
  );

}


/* =====================================================
   抽選アイテム
===================================================== */

function selectWinningItem(team){

  const missing =
    getMissingParts(team);

  let candidates = [];

  /*
    まだそのチームが
    持っていないカテゴリーを優先
  */

  missing.forEach(category => {

    const items =
      data.items.filter(
        item =>
          item.team === team &&
          item.category === category
      );

    candidates =
      candidates.concat(items);

  });


  /*
    何もなければ
    チーム登録アイテムから抽選
  */

  if(candidates.length === 0){

    candidates =
      getTeamItems(team);

  }


  if(candidates.length === 0){

    return null;

  }


  return candidates[
    Math.floor(
      Math.random() * candidates.length
    )
  ];

}


/* =====================================================
   アイテム装着
===================================================== */

function equipItem(item){

  if(!item) return;

  const category =
    item.category;


  /*
    ワンピース・ドレスを着ると
    トップ・ボトムを外す
  */

  if(
    category === "onepiece" ||
    category === "dress"
  ){

    data.equipped.top = null;
    data.equipped.bottom = null;

  }


  /*
    トップ・ボトムを着ると
    ワンピース・ドレスを外す
  */

  if(
    category === "top" ||
    category === "bottom"
  ){

    data.equipped.onepiece = null;
    data.equipped.dress = null;

  }


  /*
    ワンピースとドレスは
    同時装着しない
  */

  if(category === "onepiece"){

    data.equipped.dress = null;

  }

  if(category === "dress"){

    data.equipped.onepiece = null;

  }


  data.equipped[category] =
    item.id;


  renderCharacter();

}

   ギフトボタン
===================================================== */

$("giftBtn").addEventListener(
  "click",
  function(){

    openModal("teamModal");

  }
);


/* =====================================================
   チーム選択
===================================================== */

$("team1Choice").addEventListener(
  "click",
  function(){

    closeModal("teamModal");

    startDraw("team1");

  }
);


$("team2Choice").addEventListener(
  "click",
  function(){

    closeModal("teamModal");

    startDraw("team2");

  }
);


/* =====================================================
   抽選開始
===================================================== */

let drawTimer = null;

function startDraw(team){

  const item =
    selectWinningItem(team);

  if(!item){

    alert(
      "このチームに登録されたアイテムがありません。\n\n「アイテム」からアイテムを登録してください。"
    );

    return;

  }


  $("drawTeamName").textContent =
    team === "team1"
      ? data.settings.team1
      : data.settings.team2;

  $("drawTeamName").style.color =
    team === "team1"
      ? data.settings.team1Color
      : data.settings.team2Color;

  $("drawStatus").textContent =
    "パーツ抽選中…";

  $("rouletteResult").style.display =
    "none";

  $("closeRouletteBtn").style.display =
    "none";

  $("roulette").classList.add(
    "spinning"
  );

  openModal("rouletteModal");


  clearTimeout(drawTimer);

  drawTimer =
    setTimeout(
      function(){

        finishDraw(
          team,
          item
        );

      },
      1200
    );

}


/* =====================================================
   抽選終了
===================================================== */

function finishDraw(team,item){

  $("roulette").classList.remove(
    "spinning"
  );


  const category =
    item.category;


  data.owners[category] =
    team;


  equipItem(item);

  saveData();

  updateProgress();


  $("drawStatus").textContent =
    "獲得しました！";

  $("rouletteCategory").textContent =
    CATEGORY_NAMES[category];

  $("rouletteItemName").textContent =
    item.name;

  $("rouletteResult").style.display =
    "block";

  $("closeRouletteBtn").style.display =
    "block";


  /*
    8個そろったか確認
  */

  const complete =
    getMissingParts(team).length === 0;


  if(complete){

    $("closeRouletteBtn").textContent =
      "🏆 結果を見る";

    $("closeRouletteBtn").onclick =
      function(){

        closeModal("rouletteModal");

        showWinner(team);

      };

  }else{

    $("closeRouletteBtn").textContent =
      "OK";

    $("closeRouletteBtn").onclick =
      function(){

        closeModal("rouletteModal");

      };

  }

}


/* =====================================================
   勝利表示
===================================================== */

function showWinner(team){

  $("winTeamName").textContent =
    team === "team1"
      ? data.settings.team1
      : data.settings.team2;

  $("winTeamName").style.color =
    team === "team1"
      ? data.settings.team1Color
      : data.settings.team2Color;

}

/* =====================================================
   キャラクター登録
===================================================== */

$("characterBtn").addEventListener(
  "click",
  function(){

    renderCharacterList();

    openModal("characterModal");

  }
);


$("addCharacterBtn").addEventListener(
  "click",
  function(){

    const file =
      $("characterFile").files[0];

    if(!file){

      alert(
        "キャラクター画像を選択してください。"
      );

      return;

    }


    const name =
      $("characterName").value.trim()
      || `キャラクター${data.characters.length + 1}`;


    const reader =
      new FileReader();


    reader.onload =
      function(e){

        data.characters.push({

          id:
            Date.now(),

          name:name,

          src:e.target.result

        });


        if(
          data.selectedCharacter === null
        ){

          data.selectedCharacter = 0;

        }


        saveData();

        renderCharacter();

        renderCharacterList();


        $("characterName").value =
          "";

        $("characterFile").value =
          "";

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   キャラクター一覧
===================================================== */

function renderCharacterList(){

  const list =
    $("characterList");

  list.innerHTML = "";


  if(data.characters.length === 0){

    list.innerHTML =
      `<div class="emptyText">
        キャラクターがまだありません
      </div>`;

    return;

  }


  data.characters.forEach(
    (character,index) => {

      const card =
        document.createElement("div");

      card.className =
        "characterCard" +
        (
          index === data.selectedCharacter
            ? " selected"
            : ""
        );


      card.innerHTML = `

        <img
          src="${character.src}"
          alt=""
        >

        <div class="characterCardName">
          ${escapeHTML(character.name)}
        </div>

        <button
          type="button"
          data-select-character="${index}"
        >
          このキャラを使う
        </button>

        <button
          type="button"
          data-delete-character="${index}"
          style="background:#eee;color:#111"
        >
          削除
        </button>

      `;


      list.appendChild(card);

    }
  );


  list
    .querySelectorAll(
      "[data-select-character]"
    )
    .forEach(btn => {

      btn.addEventListener(
        "click",
        function(){

          const index =
            Number(
              this.dataset.selectCharacter
            );

          data.selectedCharacter =
            index;

          /*
            キャラクターを変更したら
            現在の着せ替えはそのまま表示
          */

          saveData();

          renderCharacter();

          renderCharacterList();

        }
      );

    });


  list
    .querySelectorAll(
      "[data-delete-character]"
    )
    .forEach(btn => {

      btn.addEventListener(
        "click",
        function(){

          const index =
            Number(
              this.dataset.deleteCharacter
            );


          if(
            !confirm(
              "このキャラクターを削除しますか？"
            )
          ){

            return;

          }


          data.characters.splice(
            index,
            1
          );


          if(
            data.characters.length === 0
          ){

            data.selectedCharacter =
              null;

          }else if(
            data.selectedCharacter === index
          ){

            data.selectedCharacter =
              0;

          }else if(
            data.selectedCharacter > index
          ){

            data.selectedCharacter--;

          }


          saveData();

          renderCharacter();

          renderCharacterList();

        }
      );

    });

}

          price:price,

        $("itemFile").value =

/* =====================================================
   アイテム一覧
===================================================== */

async function renderItemList(){

  const list =
    $("itemList");

  list.innerHTML = "";


  if(data.items.length === 0){

    list.innerHTML =
      `<div class="emptyText">
        アイテムがまだありません
      </div>`;

    return;

  }


  const tabs =
    document.createElement("div");

  tabs.className =
    "categoryTabs";


  CATEGORIES.forEach(
    (category,index) => {

      const btn =
        document.createElement("button");

      btn.type =
        "button";

      btn.className =
        "categoryBtn" +
        (
          index === 0
            ? " active"
            : ""
        );

      btn.textContent =
        CATEGORY_NAMES[category];

      btn.dataset.category =
        category;

      tabs.appendChild(btn);

    }
  );


  list.appendChild(tabs);


  const grid =
    document.createElement("div");

  grid.className =
    "itemGrid";

  list.appendChild(grid);


  async function showCategory(category){

    grid.innerHTML = "";


    const items =
      data.items.filter(
        item =>
          item.category === category
      );


    if(items.length === 0){

      grid.innerHTML =
        `<div
          class="emptyText"
          style="grid-column:1/-1"
        >
          このカテゴリーのアイテムはありません
        </div>`;

      return;

    }


    for(
      const item of items
    ){

      const card =
        document.createElement("div");

      card.className =
        "itemCard";


      const img =
        document.createElement("img");

      img.alt =
        "";

      img.src =
        await cropImageForDisplay(
          item.src
        );


      const name =
        document.createElement("div");

      name.className =
        "itemName";

      name.textContent =
        item.name;


      const price =
        document.createElement("div");

      price.className =
        "itemPrice";

      price.textContent =
        `🪙 ${item.price}コイン`;


      const team =
        document.createElement("div");

      team.className =
        "itemTeam";

      team.textContent =
        item.team === "team1"
          ? data.settings.team1
          : data.settings.team2;

      team.style.background =
        item.team === "team1"
          ? data.settings.team1Color
          : data.settings.team2Color;


      const deleteBtn =
        document.createElement("button");

      deleteBtn.type =
        "button";

      deleteBtn.className =
        "itemDelete";

      deleteBtn.textContent =
        "削除";


      deleteBtn.addEventListener(
        "click",
        function(){

          if(
            !confirm(
              "このアイテムを削除しますか？"
            )
          ){

            return;

          }


          /*
            装着中なら外す
          */

          CATEGORIES.forEach(
            category => {

              if(
                data.equipped[category] ===
                item.id
              ){

                data.equipped[category] =
                  null;

              }

            }
          );


          data.items =
            data.items.filter(
              x =>
                x.id !== item.id
            );


          saveData();

          renderCharacter();

          renderItemList();

        }
      );


      card.appendChild(img);

      card.appendChild(name);

      card.appendChild(price);

      card.appendChild(team);

      card.appendChild(deleteBtn);

      grid.appendChild(card);

    }

  }


  tabs
    .querySelectorAll(".categoryBtn")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        function(){

          tabs
            .querySelectorAll(
              ".categoryBtn"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );

          this.classList.add(
            "active"
          );

          showCategory(
            this.dataset.category
          );

        }
      );

    });


  showCategory(
    CATEGORIES[0]
  );

}

   リセット

    );

  });


/* =====================================================
   モーダル背景クリック
===================================================== */

document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener(
      "click",
      function(e){

        if(e.target === this){

          this.classList.remove(
            "show"
          );

        }

      }
    );

  });


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHTML(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   初期化
===================================================== */

loadData();

updateHeader();

renderCharacter();

updateProgress();

</script>

</body>
